# yaml-language-server: $schema=https://www.schemastore.org/pre-commit-config.json
---
ci:
  skip:
    - mado
    - ty
    - hadolint
exclude: ^styles/(Google|write-good|proselint)/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    mise_tools: [ruff]
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.84
    mise_tools: [uv]
    hooks:
      - id: ty
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.70.0
    mise_tools: [oxfmt, node]
    hooks:
      - id: oxfmt
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.85.0
    mise_tools: [oxlint]
    hooks:
      - id: oxlint
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    mise_tools: [actionlint]
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    mise_tools: [zizmor]
    hooks:
      - id: zizmor
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    mise_tools: [shfmt]
    hooks:
      - id: shfmt
  - repo: local
    hooks:
      - id: bash-syntax-check
        name: bash-syntax-check
        entry: pre-commit hazmat n1 /bin/bash -n --
        args: []
        language: system
        minimum_pre_commit_version: 4.5.0
        mise_tools: [pre-commit]
        types: [shell]
        exclude_types: [zsh]
      - id: oxfmt-yaml
        name: oxfmt-yaml
        mise_tools: [oxfmt, node]
        description: Format YAML files with oxfmt
        entry: oxfmt
        language: node
        additional_dependencies: [oxfmt@0.70.0]
        types: [yaml]
        args: []
        require_serial: false
      - id: oxfmt-json
        name: oxfmt-json
        mise_tools: [oxfmt, node]
        description: Format JSON files with oxfmt
        entry: oxfmt
        language: node
        additional_dependencies: [oxfmt@0.70.0]
        types: [json]
        args: []
        require_serial: false
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    mise_tools: [shellcheck]
    hooks:
      - id: shellcheck
  - repo: https://github.com/ewhauser/shuck
    rev: v0.2.3
    mise_tools: [github:ewhauser/shuck]
    hooks:
      - id: shuck
  - repo: https://github.com/reteps/dockerfmt
    rev: v0.5.4
    mise_tools: [github:reteps/dockerfmt]
    hooks:
      - id: dockerfmt
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    mise_tools: [hadolint]
    hooks:
      - id: hadolint
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.77
    mise_tools: [rumdl]
    hooks:
      - id: rumdl-fmt
      - id: rumdl-check
  - repo: https://github.com/akiomik/mado
    rev: v0.3.2
    mise_tools: [github:akiomik/mado]
    hooks:
      - id: mado
  - repo: https://github.com/vale-cli/vale
    rev: v3.23.0
    mise_tools: [vale]
    hooks:
      - id: vale
        types: [markdown]
      - id: vale-commit-msg
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.5.8
    mise_tools: [tombi]
    hooks:
      - id: tombi-format
        args: [--offline]
      - id: tombi-lint
        args: [--offline]
  - repo: https://github.com/owenlamont/ryl-pre-commit
    rev: v0.22.0
    mise_tools: [github:owenlamont/ryl]
    hooks:
      - id: ryl
        args: [--fix]
      - id: ryl-markdown
        args: [--fix]
