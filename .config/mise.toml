#:schema https://mise.jdx.dev/schema/mise.json

[env]
SKIP = "sourcemeta-jsonschema-lint,check-jsonschema,check-metaschema,taplo-lint,taplo-format"

[tools]
"github:akiomik/mado" = "0.3.2"
"github:ewhauser/shuck" = "0.2.4"
"github:owenlamont/ryl" = "0.24.0"
"github:reteps/dockerfmt" = "0.5.4"
"pypi:check-jsonschema" = "0.38.2"
"pypi:pre-commit-hooks" = "6.0.0"
"pypi:pyrefly" = "1.3.2"
"pypi:uv-to-pipfile" = "0.0.7"
actionlint = "1.7.12"
hadolint = "2.15.1"
jactionlint = "2.2.0"
jsonschema = "17.2.1"
node = "24.21.0"
oxfmt = "0.73.0"
oxlint = "1.84.0"
pre-commit = "4.7.0"
prek = "0.5.5"
ruff = "0.17.0"
rumdl = "0.2.79"
shellcheck = "0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
tombi = "1.8.4"
uv = "0.13.1"
vale = "3.24.0"
zizmor = "1.30.1"

[tasks.bump]
description = "Update upstream hook revs and regenerate .pre-commit-hooks.yaml"
run = """
prek autoupdate
./main.py
prek run --all-files || prek run --all-files
"""
