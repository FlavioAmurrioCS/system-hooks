#:schema https://mise.jdx.dev/schema/mise.json

[env]
SKIP = "sourcemeta-jsonschema-lint,check-jsonschema,check-metaschema,taplo-lint,taplo-format"

[tools]
"github:akiomik/mado" = "0.4.0"
"github:ewhauser/shuck" = "0.2.7"
"github:owenlamont/ryl" = "0.29.0"
"github:reteps/dockerfmt" = "0.6.0"
"pypi:check-jsonschema" = "0.39.0"
"pypi:pre-commit-hooks" = "6.0.0"
"pypi:pyrefly" = "1.4.1"
"pypi:uv-to-pipfile" = "0.0.7"
actionlint = "1.7.12"
betterleaks = "1.10.0"
gitleaks = "8.30.1"
hadolint = "2.15.1"
jactionlint = "2.5.0"
jsonschema = "17.3.3"
node = "26.12.1"
oxfmt = "0.77.0"
oxlint = "1.92.0"
pre-commit = "4.7.0"
prek = "0.5.7"
ripsecrets = "0.1.11"
ruff = "0.17.4"
rumdl = "0.3.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
tombi = "1.10.0"
trufflehog = "3.99.8"
uv = "0.13.7"
vale = "3.26.0"
zizmor = "1.32.0"

[tasks.bump]
description = "Update upstream hook revs and regenerate .pre-commit-hooks.yaml"
run = """
prek autoupdate
./main.py
prek run --all-files || prek run --all-files
"""
