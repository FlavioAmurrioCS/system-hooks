#:schema https://mise.jdx.dev/schema/mise.json

[env]
SKIP = "sourcemeta-jsonschema-lint,check-jsonschema,check-metaschema,taplo-lint,taplo-format"

[tools]
"github:akiomik/mado" = "0.3.2"
"github:ewhauser/shuck" = "0.2.7"
"github:owenlamont/ryl" = "0.26.0"
"github:reteps/dockerfmt" = "0.5.4"
"pypi:check-jsonschema" = "0.38.2"
"pypi:pre-commit-hooks" = "6.0.0"
"pypi:pyrefly" = "1.4.0"
"pypi:uv-to-pipfile" = "0.0.7"
actionlint = "1.7.12"
betterleaks = "1.9.0"
gitleaks = "8.30.1"
hadolint = "2.15.1"
jactionlint = "2.3.0"
jsonschema = "17.3.0"
node = "26.12.1"
oxfmt = "0.74.0"
oxlint = "1.89.0"
pre-commit = "4.7.0"
prek = "0.5.7"
ripsecrets = "0.1.11"
ruff = "0.17.2"
rumdl = "0.3.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
tombi = "1.9.5"
trufflehog = "3.99.7"
uv = "0.13.5"
vale = "3.25.1"
zizmor = "1.31.1"

[tasks.bump]
description = "Update upstream hook revs and regenerate .pre-commit-hooks.yaml"
run = """
prek autoupdate
./main.py
prek run --all-files || prek run --all-files
"""
