[project]
name = "fixture"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

# Same group layout as python-cookie, which the uv-* hooks rely on.
[dependency-groups]
dev = [{ include-group = "test" }, { include-group = "types" }]
test = ["pytest"]
types = [{ include-group = "test" }, "mypy"]
type-checkers = [
  { include-group = "types" },
  "basedpyright",
  "pyrefly",
  "pyright[nodejs]",
  "ty",
  "zuban",
]

# Same type-checker settings as python-cookie (tools default to lenient modes
# that can miss the error in the bad fixture, e.g. pyrefly's `basic` preset).
[tool.mypy]
strict = true

[tool.zuban]
mode = "default"
strict = true

[tool.pyright]
typeCheckingMode = "strict"

[tool.pyrefly]
preset = "strict"

[tool.ty.rules]
all = "error"
