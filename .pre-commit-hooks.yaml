  exclude_types: [csh, tcsh]
  stages: [pre-commit, pre-merge-commit, pre-push, manual]
  minimum_pre_commit_version: 3.2.0 # for "stages" names
- id: mise-shfmt
  name: shfmt
  description: Shell source code formatter (prebuilt upstream executable)
  language: system
  entry: mise exec shfmt -- shfmt
  args: [--indent=4, --case-indent, --space-redirects, --write]
  types: [shell]
  exclude_types: [csh, tcsh]
  stages: [pre-commit, pre-merge-commit, pre-push, manual]
  minimum_pre_commit_version: 3.2.0 # for "stages" names
################################################################################
# endregion: https://github.com/scop/pre-commit-shfmt/tree/v3.14.1-1
