# yaml-language-server: $schema=https://www.schemastore.org/pre-commit-hooks.json
# GENERATED by scripts/sync.py from upstream/.pre-commit-config.yaml -- do not edit by hand.
# Upstream hook settings are copied with `language: system` so the tool version
# comes from mise (or whatever is on PATH); local hooks are published as written.

- id: check-added-large-files
  name: check for added large files
  description: prevents giant files from being committed.
  entry: check-added-large-files
  language: system
  stages: [pre-commit, pre-push, manual]

- id: check-case-conflict
  name: check for case conflicts
  description: checks for files that would conflict in case-insensitive filesystems.
  entry: check-case-conflict
  language: system

- id: check-executables-have-shebangs
  name: check that executables have shebangs
  description: ensures that (non-binary) executables have a shebang.
  entry: check-executables-have-shebangs
  language: system
  types: [text, executable]
  stages: [pre-commit, pre-push, manual]

- id: check-illegal-windows-names
  name: check illegal windows names
  entry: Illegal Windows filenames detected
  language: fail
  files: (?i)((^|/)(CON|PRN|AUX|NUL|COM[\d¹²³]|LPT[\d¹²³])(\.|/|$)|[<>:\"\\|?*\x00-\x1F]|/[^/]*[\.\s]/|[^/]*[\.\s]$)

- id: check-json
  name: check json
  description: checks json files for parseable syntax.
  entry: check-json
  language: system
  types: [json]

- id: check-merge-conflict
  name: check for merge conflicts
  description: checks for files that contain merge conflict strings.
  entry: check-merge-conflict
  language: system
  types: [text]

- id: check-shebang-scripts-are-executable
  name: check that scripts with shebangs are executable
  description: ensures that (non-binary) files with a shebang are executable.
  entry: check-shebang-scripts-are-executable
  language: system
  types: [text]
  stages: [pre-commit, pre-push, manual]

- id: check-symlinks
  name: check for broken symlinks
  description: checks for symlinks which do not point to anything.
  entry: check-symlinks
  language: system
  types: [symlink]

- id: check-toml
  name: check toml
  description: checks toml files for parseable syntax.
  entry: check-toml
  language: system
  types: [toml]

- id: check-yaml
  name: check yaml
  description: checks yaml files for parseable syntax.
  entry: check-yaml
  language: system
  types: [yaml]

- id: debug-statements
  name: debug statements (python)
  description: checks for debugger imports and py37+ `breakpoint()` calls in python source.
  entry: debug-statement-hook
  language: system
  types: [python]

- id: detect-private-key
  name: detect private key
  description: detects the presence of private keys.
  entry: detect-private-key
  language: system
  types: [text]

- id: end-of-file-fixer
  name: fix end of files
  description: ensures that a file is either empty, or ends with one newline.
  entry: end-of-file-fixer
  language: system
  types: [text]
  stages: [pre-commit, pre-push, manual]

- id: mixed-line-ending
  name: mixed line ending
  description: replaces or checks mixed line ending.
  entry: mixed-line-ending
  language: system
  types: [text]

- id: name-tests-test
  name: python tests naming
  description: verifies that test files are named correctly.
  entry: name-tests-test
  language: system
  files: (^|/)tests/.+\.py$

- id: requirements-txt-fixer
  name: fix requirements.txt
  description: sorts entries in requirements.txt.
  entry: requirements-txt-fixer
  language: system
  files: (requirements|constraints).*\.txt$

- id: trailing-whitespace
  name: trim trailing whitespace
  description: trims trailing whitespace.
  entry: trailing-whitespace-fixer
  language: system
  types: [text]
  stages: [pre-commit, pre-push, manual]

- id: gitleaks
  name: Detect hardcoded secrets
  description: Detect hardcoded secrets using Gitleaks
  entry: gitleaks git --pre-commit --redact --staged --verbose
  language: system
  pass_filenames: false

- id: shellcheck
  name: shellcheck
  description: Test shell scripts with shellcheck
  entry: shellcheck
  language: system
  types: [shell]
  exclude_types: [zsh]
  require_serial: true

- id: shfmt
  name: shfmt
  description: Shell source code formatter (prebuilt upstream executable)
  language: system
  entry: shfmt
  args: [--write]
  types: [shell]
  exclude_types: [csh, tcsh]
  stages: [pre-commit, pre-merge-commit, pre-push, manual]

- id: vale
  name: vale
  description: Run vale on your text
  entry: vale
  language: system
  types: [text]

- id: ruff-check
  name: ruff check
  description: Run 'ruff check' for extremely fast Python linting
  entry: ruff check --force-exclude
  language: system
  types_or: [python, pyi, jupyter]
  args: []
  require_serial: true

- id: ruff-format
  name: ruff format
  description: Run 'ruff format' for extremely fast Python formatting
  entry: ruff format --force-exclude
  language: system
  types_or: [python, pyi, jupyter, markdown]
  args: []
  require_serial: true

- id: ruff
  name: ruff (legacy alias)
  description: Run 'ruff check' for extremely fast Python linting
  entry: ruff check --force-exclude
  language: system
  types_or: [python, pyi, jupyter]
  args: []
  require_serial: true

- id: taplo-format
  alias: taplo
  name: taplo-format
  description: Format TOML documents
  entry: taplo format
  language: system
  types: [toml]
  args: []
  require_serial: false

- id: taplo-lint
  name: taplo-lint
  description: Lint TOML documents
  entry: taplo lint
  language: system
  types: [toml]
  args: []
  require_serial: false

- id: uv-lock
  name: uv-lock
  description: Automatically run 'uv lock' on your project dependencies
  entry: uv lock
  language: system
  files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
  args: []
  pass_filenames: false

- id: uv-export
  name: uv-export
  description: Automatically run 'uv export' on your project dependencies
  entry: uv export
  language: system
  files: ^uv\.lock$
  args: [--frozen, --output-file=requirements.txt, --quiet]
  pass_filenames: false

- id: uv-ty
  name: uv-ty
  entry: env VIRTUAL_ENV= uv run --group=type-checkers ty check
  language: system
  types_or: [python, pyi]
  require_serial: true

- id: uv-pyrefly
  name: uv-pyrefly
  entry: env VIRTUAL_ENV= uv run --group=type-checkers pyrefly check
  language: system
  types_or: [python, pyi]
  require_serial: true

- id: uv-zuban
  name: uv-zuban
  entry: env VIRTUAL_ENV= uv run --group=type-checkers zuban check
  language: system
  types_or: [python, pyi]
  require_serial: true

- id: uv-mypy
  name: uv-mypy
  entry: env VIRTUAL_ENV= uv run mypy
  language: system
  types_or: [python, pyi]
  require_serial: true

- id: uv-basedpyright
  name: uv-basedpyright
  entry: env VIRTUAL_ENV= uv run --group=type-checkers basedpyright
  language: system
  types_or: [python, pyi]
  require_serial: true

- id: uv-pyright
  name: uv-pyright
  entry: env VIRTUAL_ENV= uv run --group=type-checkers pyright
  language: system
  types_or: [python, pyi]
  require_serial: true

- id: uv-test
  name: uv-test
  entry: env VIRTUAL_ENV= uv run pytest
  language: system
  types: [python]
  pass_filenames: false
  always_run: true
