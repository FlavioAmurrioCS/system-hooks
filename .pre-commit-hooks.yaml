# yaml-language-server: $schema=https://www.schemastore.org/pre-commit-hooks.json
---
################################################################################
# region: https://github.com/astral-sh/ruff-pre-commit/tree/v0.16.10
################################################################################
- id: ruff-check
  name: ruff check
  description: Run 'ruff check' for extremely fast Python linting
  entry: ruff check --force-exclude
  language: system
  types_or: [python, pyi, jupyter]
  args: [--fix, --unsafe-fixes]
  require_serial: true
  minimum_pre_commit_version: 2.9.2
- id: mise-ruff-check
  name: ruff check
  description: Run 'ruff check' for extremely fast Python linting
  entry: mise exec ruff -- ruff check --force-exclude
  language: system
  types_or: [python, pyi, jupyter]
  args: [--fix, --unsafe-fixes]
  require_serial: true
  minimum_pre_commit_version: 2.9.2
- id: ruff-format
  name: ruff format
  description: Run 'ruff format' for extremely fast Python formatting
  entry: ruff format --force-exclude
  language: system
  types_or: [python, pyi, jupyter, markdown]
  args: []
  require_serial: true
  minimum_pre_commit_version: 2.9.2
- id: mise-ruff-format
  name: ruff format
  description: Run 'ruff format' for extremely fast Python formatting
  entry: mise exec ruff -- ruff format --force-exclude
  language: system
  types_or: [python, pyi, jupyter, markdown]
  args: []
  require_serial: true
  minimum_pre_commit_version: 2.9.2
################################################################################
# endregion: https://github.com/astral-sh/ruff-pre-commit/tree/v0.16.10
################################################################################

################################################################################
# region: https://github.com/astral-sh/ty-pre-commit/tree/v0.0.85
################################################################################
- id: ty
  name: ty
  description: Run 'ty' for extremely fast Python type checking
  entry: uv check --quiet --preview-features=check-command
  language: system
  types_or: [python, pyi, jupyter]
  args: []

  # Check the whole project instead of appending matching filenames to the command.
  #
  # Exactly which files ty should emit diagnostics on can be configured using
  # the ty configuration file. Changes in file `b.py` can cause new diagnostics to
  # appear in `a.py`, so passing only `b.py` as a positional argument to `ty check`
  # if only `b.py` changed would give a false sense of security regarding whether
  # the code still type-checks.
  pass_filenames: false
  always_run: true
  require_serial: true
  minimum_pre_commit_version: 2.9.2
- id: mise-ty
  name: ty
  description: Run 'ty' for extremely fast Python type checking
  entry: mise exec uv -- uv check --quiet --preview-features=check-command
  language: system
  types_or: [python, pyi, jupyter]
  args: []

  # Check the whole project instead of appending matching filenames to the command.
  #
  # Exactly which files ty should emit diagnostics on can be configured using
  # the ty configuration file. Changes in file `b.py` can cause new diagnostics to
  # appear in `a.py`, so passing only `b.py` as a positional argument to `ty check`
  # if only `b.py` changed would give a false sense of security regarding whether
  # the code still type-checks.
  pass_filenames: false
  always_run: true
  require_serial: true
  minimum_pre_commit_version: 2.9.2
################################################################################
# endregion: https://github.com/astral-sh/ty-pre-commit/tree/v0.0.85
################################################################################

