################################################################################
# region: https://github.com/zizmorcore/zizmor-pre-commit/tree/v1.30.1
################################################################################
- id: zizmor
  name: zizmor
  description: Find security issues in GitHub Actions CI/CD setups
  language: system
  types: [yaml]
  # Select the YAML inputs supported by zizmor:
  # - files directly under any `.github/workflows` directory;
  # - `.github/dependabot.{yml,yaml}`;
  # - `action.{yml,yaml}` anywhere; and
  # - `.pre-commit-{config,hooks}.{yml,yaml}` anywhere.
  files: (^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$
  require_serial: true
  entry: zizmor
  args:
    - --no-progress # https://github.com/zizmorcore/zizmor/issues/582
- id: mise-zizmor
  name: zizmor
  description: Find security issues in GitHub Actions CI/CD setups
  language: system
  types: [yaml]
  # Select the YAML inputs supported by zizmor:
  # - files directly under any `.github/workflows` directory;
  # - `.github/dependabot.{yml,yaml}`;
  # - `action.{yml,yaml}` anywhere; and
  # - `.pre-commit-{config,hooks}.{yml,yaml}` anywhere.
  files: (^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$
  require_serial: true
  entry: mise exec zizmor -- zizmor
  args:
    - --no-progress # https://github.com/zizmorcore/zizmor/issues/582
################################################################################
# endregion: https://github.com/zizmorcore/zizmor-pre-commit/tree/v1.30.1
################################################################################

################################################################################
# region: https://github.com/scop/pre-commit-shfmt/tree/v3.14.1-1
